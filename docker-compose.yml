services:
  backend:
    build:
      context: ./backend
    container_name: helpdesk-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
    expose:
      - "4000"
    networks:
      - helpdesk-network

  frontend:
    build:
      context: ./frontend
    container_name: helpdesk-frontend
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - backend
    networks:
      - helpdesk-network

networks:
  helpdesk-network:
    driver: bridge
